                id: 46,
                type: "PYQ",
                question: "PYQ: The process by which mass media personnel decide what information gets printed, broadcast, or produced is known as:",
                options: [
                    "Sensationalization",
                    "Gatekeeping",
                    "Surveillance",
                    "Validation"
                ],
                correctAnswer: 1,
                explanation: "Gatekeeping is the process where individuals (Gatekeepers) limit, expand, or relay information deciding what reaches the public."
            },
            {
                id: 47,
                type: "Standard",
                question: "Which formal communication network features a central hub with spokes, where all communication must flow strictly through the central authority?",
                options: [
                    "Y-Network",
                    "Wheel Network",
                    "Circle Network",
                    "All Channel Network"
                ],
                correctAnswer: 1,
                explanation: "The Wheel Network consists of a central hub (authority) with spokes; all communication must go through the center."
            },
            {
                id: 48,
                type: "Statement",
                question: "Statement I: The main objective of India's public broadcasting system (Prasar Bharti) is to Inform, Entertain, and Educate.\nStatement II: The 'Vyas' channel is dedicated exclusively to Agriculture.\n\nChoose the correct answer:",
                options: [
                    "Both Statement I and Statement II are correct",
                    "Both Statement I and Statement II are incorrect",
                    "Statement I is correct but Statement II is incorrect",
                    "Statement I is incorrect but Statement II is correct"
                ],
                correctAnswer: 2,
                explanation: "Statement I is correct. Statement II is incorrect because 'Vyas' is for Literature/Culture; 'Kisan' is for Agriculture."
            },
            {
                id: 49,
                type: "Standard",
                question: "A barrier arising because different departments use highly specialized terminology (jargons) that others cannot understand falls under which category?",
                options: [
                    "Psychological Barrier",
                    "Physical Barrier",
                    "Organizational Barrier",
                    "Information Overload"
                ],
                correctAnswer: 2,
                explanation: "Specialization of jobs and activities leading to jargon differences is classified under Organizational Barriers."
            },
            {
                id: 50,
                type: "PYQ",
                question: "PYQ: Verbal/Oral communication is highly recommended when:",
                options: [
                    "Documentary evidence is strictly required for legal purposes",
                    "Direct face-to-face interaction is required to build rapport and get immediate feedback",
                    "The message needs to be formally preserved for long-term records",
                    "Communication is required across drastically different time zones"
                ],
                correctAnswer: 1,
                explanation: "Oral communication is recommended when direct interaction, rapport building, and immediate/spontaneous feedback are needed."
            }
        ];

        const { useState, useEffect } = React;

        const QuizApp = () => {
            const [gameState, setGameState] = useState('START'); // START, PLAYING, RESULT
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState(new Array(QUIZ_DATA.length).fill(null));
            const [score, setScore] = useState(0);

            const startQuiz = () => {
                setGameState('PLAYING');
                setCurrentQuestionIndex(0);
                setUserAnswers(new Array(QUIZ_DATA.length).fill(null));
                setScore(0);
            };

            const handleAnswer = (optionIndex) => {
                const newAnswers = [...userAnswers];
                newAnswers[currentQuestionIndex] = optionIndex;
                setUserAnswers(newAnswers);
            };

            const nextQuestion = () => {
                if (currentQuestionIndex < QUIZ_DATA.length - 1) {
                    setCurrentQuestionIndex(currentQuestionIndex + 1);
                } else {
                    calculateScore();
                    setGameState('RESULT');
                }
            };

            const prevQuestion = () => {
                if (currentQuestionIndex > 0) {
                    setCurrentQuestionIndex(currentQuestionIndex - 1);
                }
            };

            const calculateScore = () => {
                let calculatedScore = 0;
                userAnswers.forEach((ans, index) => {
                    if (ans === QUIZ_DATA[index].correctAnswer) {
                        calculatedScore += 2; // +2 marks for UGC NET format
                    }
                });
                setScore(calculatedScore);
            };

            if (gameState === 'START') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-indigo-800 p-4 text-white">
                        <div className="bg-white/10 backdrop-blur-lg p-8 md:p-12 rounded-3xl shadow-2xl max-w-2xl text-center border border-white/20">
                            <div className="mb-6 flex justify-center">
                                <i data-lucide="graduation-cap" className="w-20 h-20 text-yellow-400"></i>
                            </div>
                            <h1 className="text-4xl md:text-5xl font-bold mb-4">UGC NET JRF Simulator</h1>
                            <p className="text-xl text-blue-200 mb-2">Paper 1: Unit 8 (ICT) & Unit 4 (Communication)</p>
                            <p className="text-md text-blue-300 mb-8 font-light">Contains 50 highly curated Standard, A/R, Statement, and PYQ Traps based on your expert notes.</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8 text-left text-sm bg-black/20 p-4 rounded-xl">
                                <div><span className="font-semibold text-yellow-400">Total Questions:</span> 50</div>
                                <div><span className="font-semibold text-yellow-400">Marks per Question:</span> +2</div>
                                <div><span className="font-semibold text-yellow-400">Negative Marking:</span> No</div>
                                <div><span className="font-semibold text-yellow-400">Max Score:</span> 100</div>
                            </div>

                            <button 
                                onClick={startQuiz}
                                className="bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-blue-900 font-bold py-4 px-12 rounded-full text-xl transition-all transform hover:scale-105 shadow-xl"
                            >
                                Start Mock Test
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'RESULT') {
                const percentage = (score / 100) * 100;
                let remark = "Keep Practicing!";
                if(percentage >= 80) remark = "JRF Ready! Excellent!";
                else if (percentage >= 60) remark = "Good, NET qualified likely!";

                return (
                    <div className="min-h-screen bg-gray-50 py-10 px-4">
                        <div className="max-w-4xl mx-auto">
                            <div className="bg-white rounded-3xl shadow-xl p-8 text-center mb-8 border-t-8 border-indigo-600">
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Test Completed</h2>
                                <p className="text-gray-500 mb-6">Review your performance</p>
                                <div className="inline-block bg-indigo-50 rounded-full p-8 border-4 border-indigo-100 mb-4">
                                    <div className="text-5xl font-black text-indigo-700">{score}<span className="text-2xl text-indigo-400">/100</span></div>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-700">{remark}</h3>
                                <button 
                                    onClick={startQuiz}
                                    className="mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-full transition-colors"
                                >
                                    Retake Test
                                </button>
                            </div>

                            <h3 className="text-2xl font-bold text-gray-800 mb-6 px-2">Detailed Solution & Analysis</h3>
                            <div className="space-y-6">
                                {QUIZ_DATA.map((q, index) => {
                                    const userAnswer = userAnswers[index];
                                    const isCorrect = userAnswer === q.correctAnswer;
                                    const isSkipped = userAnswer === null;

                                    return (
                                        <div key={q.id} className={`bg-white rounded-2xl shadow-md p-6 border-l-8 ${isCorrect ? 'border-green-500' : (isSkipped ? 'border-gray-400' : 'border-red-500')}`}>
                                            <div className="flex justify-between items-start mb-4">
                                                <span className="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-full">Q {index + 1} | {q.type}</span>
                                                <span className={`text-sm font-bold px-3 py-1 rounded-full ${isCorrect ? 'bg-green-100 text-green-700' : (isSkipped ? 'bg-gray-100 text-gray-600' : 'bg-red-100 text-red-700')}`}>
                                                    {isCorrect ? '+2 Marks' : (isSkipped ? 'Skipped' : '0 Marks')}
                                                </span>
                                            </div>
                                            <p className="font-semibold text-gray-800 text-lg mb-4 whitespace-pre-wrap">{q.question}</p>
                                            
                                            <div className="space-y-2 mb-4">
                                                {q.options.map((opt, optIndex) => (
                                                    <div key={optIndex} className={`p-3 rounded-lg text-sm border ${
                                                        optIndex === q.correctAnswer ? 'bg-green-50 border-green-200 text-green-800 font-medium' :
                                                        optIndex === userAnswer && !isCorrect ? 'bg-red-50 border-red-200 text-red-800' :
                                                        'bg-gray-50 border-gray-100 text-gray-600'
                                                    }`}>
                                                        {opt}
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="bg-blue-50 border border-blue-100 rounded-xl p-4">
                                                <div className="flex items-center text-blue-800 font-bold mb-1 text-sm">
                                                    <i data-lucide="info" className="w-4 h-4 mr-1"></i> Expert Explanation
                                                </div>
                                                <p className="text-blue-900 text-sm leading-relaxed">{q.explanation}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const currentQ = QUIZ_DATA[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === QUIZ_DATA.length - 1;

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    {/* Header bar */}
                    <div className="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                        <div className="font-bold text-indigo-700 flex items-center">
                            <i data-lucide="laptop" className="w-5 h-5 mr-2"></i> NTA CBT SIMULATOR
                        </div>
                        <div className="flex space-x-2">
                            {/* Minimap for progress */}
                            <div className="text-sm font-semibold bg-indigo-50 text-indigo-700 px-4 py-1.5 rounded-full border border-indigo-100">
                                {currentQuestionIndex + 1} / {QUIZ_DATA.length}
                            </div>
                        </div>
                    </div>

                    {/* Question Content */}
                    <div className="flex-grow p-4 md:p-8 flex justify-center items-start">
                        <div className="bg-white w-full max-w-4xl rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
                            <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                                <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    {currentQ.type} Question
                                </span>
                                <span className="text-gray-400 text-sm">ID: NET26_{currentQ.id}</span>
                            </div>
                            
                            <div className="p-6 md:p-10">
                                <p className="text-xl text-gray-800 font-medium mb-8 whitespace-pre-wrap leading-relaxed">
                                    {currentQ.question}
                                </p>

                                <div className="space-y-4">
                                    {currentQ.options.map((opt, index) => {
                                        const isSelected = userAnswers[currentQuestionIndex] === index;
                                        return (
                                            <label 
                                                key={index}
                                                className={`flex items-start p-4 rounded-xl border-2 cursor-pointer transition-all ${
                                                    isSelected 
                                                    ? 'border-indigo-600 bg-indigo-50' 
                                                    : 'border-gray-200 hover:border-indigo-300 hover:bg-gray-50'
                                                }`}
                                            >
                                                <div className="flex-shrink-0 mt-0.5">
                                                    <input 
                                                        type="radio" 
                                                        name={`q-${currentQ.id}`}
                                                        className="w-5 h-5 text-indigo-600 focus:ring-indigo-500"
                                                        checked={isSelected}
                                                        onChange={() => handleAnswer(index)}
                                                    />
                                                </div>
                                                <div className="ml-4">
                                                    <span className={`text-base ${isSelected ? 'text-indigo-900 font-medium' : 'text-gray-700'}`}>
                                                        {opt}
                                                    </span>
                                                </div>
                                            </label>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Footer Actions */}
                            <div className="bg-gray-50 p-4 md:p-6 border-t flex justify-between items-center">
                                <button 
                                    onClick={prevQuestion}
                                    disabled={currentQuestionIndex === 0}
                                    className={`px-6 py-2.5 rounded-lg font-semibold transition-colors ${
                                        currentQuestionIndex === 0 
                                        ? 'bg-gray-200 text-gray-400 cursor-not-allowed' 
                                        : 'bg-white border-2 border-gray-300 text-gray-700 hover:bg-gray-100'
                                    }`}
                                >
                                    Previous
                                </button>
                                
                                <button 
                                    onClick={nextQuestion}
                                    className={`px-8 py-2.5 rounded-lg font-semibold text-white shadow-md transition-colors ${
                                        isLastQuestion 
                                        ? 'bg-green-600 hover:bg-green-700' 
                                        : 'bg-indigo-600 hover:bg-indigo-700'
                                    }`}
                                >
                                    {isLastQuestion ? 'Submit Test' : 'Save & Next'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<QuizApp />, document.getElementById('root'));
        
        // Initialize Lucide icons
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
